<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PayWave Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link href="./dist/output.css" rel="stylesheet" />
  </head>
  <body class="bg-slate-50 p-6 font-sans text-slate-800">
    <h1 class="text-2xl font-bold">Component preview</h1>
    <p class="mt-1 text-slate-600">
      Testing our reusable classes. We will replace this page with the real
      dashboard in the next branch.
    </p>

    <div class="card mt-6 max-w-md space-y-4">
      <h2 class="text-lg font-semibold">.card, .badge and buttons</h2>

      <div class="flex flex-wrap gap-2">
        <span class="badge badge-paid">Paid</span>
        <span class="badge badge-pending">Pending</span>
        <span class="badge badge-failed">Failed</span>
      </div>

      <div>
        <label for="demo" class="field-label">Input with a label</label>
        <input
          id="demo"
          type="text"
          placeholder="Type here"
          class="input-field"
        />
      </div>

      <div class="flex gap-3">
        <button type="button" class="btn-primary">Primary</button>
        <button type="button" class="btn-secondary">Secondary</button>
      </div>
    </div>
  </body>
</html>
